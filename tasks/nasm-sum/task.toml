# An assembly task: nasm + ld + make, and a shell test harness the task defines.
#
# What it is here to find out: whether the contract survives a build tool that is a raw
# assembler and a linker, and a suite written as shell scripts. There is no test framework
# to lean on in assembly, so the task defines the harness -- TAP-ish ok/not ok lines, and
# the same 0/1/2 exit contract the agent's own runner reports, one level down.
#
# It also asks whether a run can be measured when the model flounders: this is the hardest
# task in the set, and a StepLimit that is reported honestly is a result, not a failure of
# the harness.
name = "nasm-sum"
spec_file = "SPEC.md"
tree = "tree"
fixed_tree = "fixed"

oracle = "oracle"
oracle_cmd = "bash oracle/accept.sh"

# What the acceptance corpus is allowed to grade: the implementation alone. It does not
# gate on the submission's own suite passing -- after a red the seal forbids repairing a
# wrong test, so that gate would fail correct code (it did, three times in `bits`).
oracle_gate = "implementation"
# A planted failing test, so `ninny verify-task` can require this task's own runner to
# report a red as a red. Runs with cwd = the staging directory, like oracle_cmd.
probe_cmd = "bash oracle/probe.sh"

test_cmd = "bash tools/run_own_tests.sh"
test_globs = ["tests/own/**"]
src_globs = ["src/**"]
protected_globs = ["Makefile", "tools/**", "tests/own/README.md"]
preflight = ["nasm -v", "ld --version", "make --version"]
step_limit = 35
timeout_s = 120
test_timeout_s = 120

[runner]
about = 'x86-64 assembly / make, with bash case scripts. Every tests/own/*.sh is run.'
note = '''Each case script prints "ok <what>" or "not ok <what>" and exits 0 (all passed), 1 (any
failed) or 2+ (could not run). The build is make; a build failure is exit 2. The loop keeps the
WORST exit code, because the last script is not the verdict.'''
require = 'tests/own/*.sh'
build = 'make'
run = 'worst=0; for t in tests/own/*.sh; do echo "--- $t"; r=$(bash "$t" 2>&1); code=$?; printf "%s\n" "$r"; [ "$code" -gt "$worst" ] && worst=$code; done; exit $worst'
count = ['^ok ', '^not ok ']
rc_unrunnable = 2
