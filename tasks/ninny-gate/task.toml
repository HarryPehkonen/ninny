name = "ninny-gate"
spec_file = "SPEC.md"
tree = "tree"

# A tree in which this task is already solved, used ONLY by `ninny verify-task` to
# prove the oracle can pass. It is the repo one commit AFTER the fix the task is about
# (`git archive 33b9ca1 ninny tests ...`), while tree/ is the commit before it, so the
# two trees differ in exactly the one defect. It sits beside the oracle, outside
# tree/, and is never copied into a run.
fixed_tree = "fixed"

# The acceptance suite lives OUTSIDE the tree, so the agent cannot read the answer
# key and write its tests from it. `ninny check` stages a copy of the submission
# beside the oracle and runs it there.
oracle = "oracle"
oracle_cmd = "bash oracle/gate.sh"

# What the acceptance corpus is allowed to grade: the implementation alone. It does not
# gate on the submission's own suite passing -- after a red the seal forbids repairing a
# wrong test, so that gate would fail correct code (it did, three times in `bits`).
oracle_gate = "implementation"
# A planted failing test, so `ninny verify-task` can require this task's own runner to report
# a red as a red rather than as "nothing ran".
probe_cmd = "bash oracle/probe.sh"

# The agent's own test loop: ninny's full suite, which must keep passing, plus any
# test the agent adds under tests/.
test_cmd = "bash tools/run_own_tests.sh"

test_globs = ["tests/**"]
src_globs = ["ninny/**"]
protected_globs = ["tools/**"]

preflight = ["python3 -V"]
step_limit = 30
timeout_s = 120
test_timeout_s = 180

[runner]
about = 'Python / unittest. Your suite is every tests/test*.py.'
note = '''discover -s tests -t . is deliberate: the tests import the package beside them, so the repo
root is the import root. A suite that does not even import prints no summary line, and "Ran 0
tests" is not a pass -- either way zero cases ran, which is exit 2, not a green.'''
run = 'python3 -m unittest discover -s tests -t .'
build_fail = '_FailedTest|Failed to import test module|^SyntaxError|^IndentationError'
sum = '^Ran ([0-9]+) tests?'
