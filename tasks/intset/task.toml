# A Rust task: the first one whose build tool and test runner are cargo.
#
# What it is here to find out: whether the exit-code contract survives a toolchain that
# does not speak it. `cargo test` exits 101 for a compile error and 101 for a failing
# test, so the runner has to separate them rather than pass Cargo's status through; and
# "0 passed" is a green run, so the count is the only evidence the suite asserted
# anything. Both are handled in tools/run_own_tests.sh, which is where the contract lives.
#
# No dependencies, by rule: the suite runs offline in the sandbox.
name = "intset"
spec_file = "SPEC.md"
tree = "tree"
fixed_tree = "fixed"

oracle = "oracle"
oracle_cmd = "bash oracle/accept.sh"
# A planted failing test, so `ninny verify-task` can require this task's own runner to
# report a red as a red. Runs with cwd = the staging directory, like oracle_cmd.
probe_cmd = "bash oracle/probe.sh"

test_cmd = "bash tools/run_own_tests.sh"
test_globs = ["tests/own/**"]
src_globs = ["src/**"]
protected_globs = ["Cargo.toml", "src/main.rs", "tools/**", "tests/own/README.md"]
# Must work INSIDE the sandbox, or a run is not scored.
preflight = ["cargo --version", "rustc --version"]
# Measured, not guessed: of 13 arms on this task, the ones that finished took 17-44 steps and
# four died AT the cap with a red already banked -- the artifact was never graded, which is worse
# than a wrong answer because it produces no data at all. Rust also pays a compile on every
# `cargo test`, so the step budget is really a build budget here. 60 lets the slow tail finish.
step_limit = 60
timeout_s = 180
test_timeout_s = 300

[runner]
about = 'Rust / cargo. tests/own/main.rs is the integration target Cargo discovers.'
note = '''Cargo exits 101 for a compile error AND for a failing test, so this script tells those apart
rather than passing Cargo status through. A sibling .rs file that main.rs does not declare with
`mod` is never compiled, so it never runs and never counts.'''
require = 'tests/own/main.rs'
run = 'cargo test --offline --color never'
build_fail = '^error\[E[0-9]+\]:|^error: could not compile|^error: expected '
sum = ['^test result: .* ([0-9]+) passed;', '^test result: .* [0-9]+ passed; ([0-9]+) failed;']
