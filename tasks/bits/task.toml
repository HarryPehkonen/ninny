# A C++ header-only library task: CMake + GoogleTest, and no binary at all.
#
# What it is here to find out: whether the contract survives a suite whose discovery is
# CONFIGURATION rather than convention. A gtest file that is not added to CMakeLists.txt is
# never built, so the suite silently gets smaller -- the case the NINNY_TESTS count exists
# for. CMake also reports a build failure and a failing test as different things, and ctest
# exits 8 for "some tests failed" but also for "No tests were found".
name = "bits"
spec_file = "SPEC.md"
tree = "tree"
oracle = "oracle"
fixed_tree = "fixed"
# The command runs with cwd set to the staging directory, where the oracle has been
# copied to ./oracle -- so the path is relative to THAT, not to the oracle directory.
oracle_cmd = "bash oracle/accept.sh"
# A planted failing test, so `ninny verify-task` can require this task's own runner to
# report a red as a red. Runs with cwd = the staging directory, like oracle_cmd.
probe_cmd = "bash oracle/probe.sh"

test_cmd = "bash tools/run_own_tests.sh"
test_globs = ["tests/own/**"]
src_globs = ["include/**", "src/**"]
# CMakeLists.txt is NOT protected: the task is to register a target in it, and refusing
# the write made the task unsolvable. Its frozen region is checked by the oracle instead.
protected_globs = ["tools/**", "tests/own/README.md"]

preflight = ["cmake --version", "g++ --version", "ctest --version"]
step_limit = 40
timeout_s = 180
test_timeout_s = 300

[runner]
about = 'C++ / CMake + GoogleTest, run by ctest. Every target registered in CMakeLists.txt.'
note = '''A gtest file that is not listed in CMakeLists.txt is never compiled and never run, so adding
a test is two steps: the file, and its lines below the marker. ctest exits 8 for BOTH "some tests
failed" and "No tests were found", so the count is what tells them apart -- and a count of zero
is exit 2.'''
build = 'cmake -S . -B .ninny-build -DCMAKE_BUILD_TYPE=Debug && cmake --build .ninny-build -j 4'
run = 'ctest --test-dir .ninny-build --output-on-failure'
sum = ['All tests passed \(([0-9]+) tests?\)', 'out of ([0-9]+)']
